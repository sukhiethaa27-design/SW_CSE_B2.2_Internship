<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag</title>
</head>
<body>
    <! -- Image tag: - ->
     <img src="dog image.jpg" alt="The image of a dog">
    <!-- src: source| alt: alternative -->
     <!-- Image type: jpg/jpeg | png | webp | gif - ->
     <img src="dog image.jpg" alt="The image of a dog" width="500" height="600">
    <!-- Title - tooltip text -->
    <img src="dog image.jpg" alt="The image of a dog" title="My name is pluto.">
    
</body>
</html>
